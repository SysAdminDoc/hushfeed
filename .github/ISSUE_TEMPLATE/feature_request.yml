name: ⭐ Feature request
description: Create a detailed request for a new feature.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        # Hushfeed feature request

        Before creating a new feature request, please keep the following in mind:

        - **Do not submit a duplicate feature request**: Search for existing feature requests [here](https://github.com/SysAdminDoc/hushfeed/issues?q=is%3Aissue%20label%3Aenhancement).
        - **Review the contribution guidelines**: Make sure your feature request adheres to them. You can find the guidelines [here](https://github.com/SysAdminDoc/hushfeed/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: requested_behavior
    attributes:
      label: Requested behavior and trigger
      description: |
        Describe the behavior you want, what starts it, and what should remain unchanged.
        Add images, videos, links, examples, or references when they help.
    validations:
      required: true
  - type: dropdown
    id: affected_surface
    attributes:
      label: Affected surface
      description: Choose where the feature should appear.
      options:
        - Feed
        - Following
        - Search
        - Inbox
        - Profile
        - Comments
        - Downloads
        - Settings
        - Notifications
        - Other
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: Explain what Hushfeed or TikTok does today and how the requested behavior differs.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        A strong motivation is necessary for a feature request to be considered.

        - Why should this feature be implemented? 
        - What is the explicit use case?
        - What are the benefits?
        - What makes this feature important?
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your feature request will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed feature requests and this is not a duplicate
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
