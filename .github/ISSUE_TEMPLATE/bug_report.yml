name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # Hushfeed bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/SysAdminDoc/hushfeed/issues?q=is%3Aissue%20label%3Abug).
        - **Review the contribution guidelines**: Make sure your bug report adheres to them. You can find the guidelines [here](https://github.com/SysAdminDoc/hushfeed/blob/main/CONTRIBUTING.md).
  - type: input
    id: tiktok_version
    attributes:
      label: TikTok package and version
      description: Include the Android package name and the exact TikTok version.
      placeholder: com.zhiliaoapp.musically 46.2.3
    validations:
      required: true
  - type: input
    id: host_versions
    attributes:
      label: Morphe Manager and Hushfeed versions
      description: Include the Morphe Manager version and the Hushfeed bundle version.
      placeholder: Morphe Manager 1.29.0, Hushfeed 0.29.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      description: The phone model and its Android version. The bundle runs from Android 6 up, and some checks only fail on one version.
      placeholder: Samsung Galaxy S22, Android 15
    validations:
      required: true
  - type: textarea
    id: selected_patches
    attributes:
      label: Selected patches
      description: List the selected Hushfeed patches, including Settings and Diagnostic tools when enabled.
      placeholder: |
        Settings
        Comment tools
        Translate comments
    validations:
      required: true
  - type: dropdown
    id: affected_surface
    attributes:
      label: Affected surface
      description: Choose where the behavior appeared.
      options:
        - Feed
        - Following
        - Search
        - Inbox
        - Profile
        - Comments
        - Downloads
        - Settings
        - Notifications
        - Other
    validations:
      required: true
  - type: textarea
    id: bug_description
    attributes:
      label: Bug description
      description: |
        Describe what happened, what you expected, and whether the behavior is repeatable.
        Add images or videos when they help explain the result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Ordered reproduction and settings changes
      description: List each step in order. Include every Hushfeed setting changed before the first failure, app restarts, and whether the same steps work on a clean install.
      placeholder: |
        1. Enabled ...
        2. Changed ...
        3. Opened ...
        4. Saw ...
    validations:
      required: true
  - type: textarea
    id: error_logs
    attributes:
      label: Error logs
      description: Attach the redacted Hushfeed diagnostic export when possible. Do not paste tokens, cookies, signed URLs, or private messages.
      render: shell
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add additional context here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
